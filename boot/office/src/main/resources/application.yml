spring:
  profiles:
    include:
    - office-data
    - core-date

  datasource:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  security:
    login:
      max-fail-count: 10
      block-duration-seconds: 3600 # 1 시간

cloud:
  aws:
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${S3_BUCKET_NAME}
    stack:
      auto: false