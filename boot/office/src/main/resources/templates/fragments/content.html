<div th:fragment="content">

    <div class="btn-group" role="group" id="tabButtons">
        <button class="btn btn-outline-primary active">원띵모임</button>
        <button class="btn btn-outline-primary">랜덤모임</button>
    </div>

    <div class="mt-3 text-end">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createMatchingModal">
            랜덤 매칭 생성
        </button>
    </div>

    <div class="table-responsive mt-3" id="matchingTableContainer">
        <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
            <tr>
                <th class="text-center">No</th>
                <th class="text-center">닉네임</th>
                <th class="text-center">전화번호</th>
                <th class="text-center">지역</th>
                <th class="text-center">날짜</th>
                <th class="text-center">주제</th>
                <th class="text-center">식단</th>
                <th class="text-center">선호언어</th>
                <th class="text-center">매칭</th>
            </tr>

            </thead>
            <tbody id="matchingTableBody">
            </tbody>
        </table>
    </div>

    <nav class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item"><a class="page-link" href="#">&lt;</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item disabled"><a class="page-link" href="#">...</a></li>
            <li class="page-item"><a class="page-link" href="#">&gt;</a></li>
        </ul>
    </nav>

    <div class="modal fade" id="createMatchingModal" tabindex="-1" aria-labelledby="createMatchingModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <form id="matchingForm" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createMatchingModalLabel">랜덤 매칭 생성</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="randomDistrict" class="form-label">선호지역</label>
                        <select class="form-select" id="randomDistrict" name="randomDistrict" required>
                            <option value="GANGNAM">강남</option>
                            <option value="YOUNGSAN_ITAEWON">용산/이태원</option>
                            <option value="GUNDAE_SEONGSU">건대/성수</option>
                            <option value="YEOUIDO_YEONGDEUNGPO">여의도/영등포</option>
                            <option value="HONGDAE_HAPJEONG">홍대/합정</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">장소</label>
                        <input type="text" class="form-control" id="location" name="location" required>
                    </div>
                    <div class="mb-3">
                        <label for="restaurantName" class="form-label">식당명</label>
                        <input type="text" class="form-control" id="restaurantName" name="restaurantName" required>
                    </div>
                    <div class="mb-3">
                        <label for="meetingTime" class="form-label">시간</label>
                        <input type="datetime-local" class="form-control" id="meetingTime" name="meetingTime" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">생성</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/matching.js}"></script>
</div>
