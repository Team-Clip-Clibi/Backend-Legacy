<div th:fragment="content">

    <div class="btn-group" role="group" id="tabButtons">
        <button class="btn btn-outline-primary active">원띵모임</button>
        <button class="btn btn-outline-primary">번개모임</button>
        <button class="btn btn-outline-primary">랜덤모임</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const buttons = document.querySelectorAll("#tabButtons .btn");

            buttons.forEach(btn => {
                btn.addEventListener("click", function () {
                    // 모든 버튼에서 active 클래스 제거
                    buttons.forEach(b => b.classList.remove("active"));
                    // 클릭한 버튼에 active 클래스 추가
                    this.classList.add("active");
                });
            });
        });
    </script>

    <div class="table-responsive">
        <table class="table table-bordered text-center align-middle">
            <thead class="table-light">
            <tr>
                <th>No</th>
                <th>닉네임</th>
                <th>전화번호</th>
                <th>원명</th>
                <th>직종</th>
                <th>연애상태</th>
                <th>식단</th>
                <th>선호언어</th>
                <th>지역</th>
                <th>매칭</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>1</td>
                <td>민민민민</td>
                <td>5469-8944</td>
                <td>자기개발</td>
                <td>직종</td>
                <td>싱글</td>
                <td>상관없음</td>
                <td>영어</td>
                <td>강남</td>
                <td><button class="btn btn-sm btn-outline-success">매칭전</button></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이지네이션 -->
    <nav class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item"><a class="page-link" href="#">&lt;</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
