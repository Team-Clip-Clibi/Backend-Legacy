<!-- 버튼 영역 (정적) -->
<div th:fragment="buttons">
    <div class="btn-group" role="group" id="tabButtons">
        <button class="btn btn-outline-primary load-content" data-url="/office/admin/home/oneThingMatching">원띵모임</button>
        <button class="btn btn-outline-primary load-content" data-url="/office/admin/home/randomMatching">랜덤모임</button>
    </div>
</div>
<div id="dynamicContent" th:fragment="dynamicContent">
    <div class="table-responsive mt-3">
        <!-- 원띵모임 테이블 -->
        <table th:if="${isOnething}" class="table table-bordered text-center align-middle">
            <thead class="table-light">
            <tr>
                <th>No</th>
                <th>주제</th>
                <th>장소</th>
                <th>모임 시간</th>
                <th>비고</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="matching, stat : ${oneThingMatchings}">
                <td th:text="${stat.count}"></td>
                <td th:text="${matching.topic}"></td>
                <td th:text="${matching.location}"></td>
                <td th:text="${#temporals.format(matching.meetingTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <a th:href="@{/office/admin/home/oneThingMatching/{id}(id=${matching.id})}" class="btn btn-primary">상세보기</a>
                    <a th:href="@{/office/admin/home/oneThingMatching/{id}(id=${matching.id})/delete}" class="btn btn-danger">삭제</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(onethingMatchings)}">
                <td colspan="5" class="text-center">등록된 원띵모임이 없습니다.</td>
            </tr>
            </tbody>
        </table>

        <!-- 랜덤모임 테이블 -->
        <table th:unless="${isOnething}" class="table table-bordered text-center align-middle">
            <thead class="table-light">
            <tr>
                <th>No</th>
                <th>지역</th>
                <th>장소</th>
                <th>식당명</th>
                <th>미팅 시간</th>
                <th>비고</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="matching, stat : ${randomMatchings}">
                <td th:text="${stat.count}"></td>
                <td th:text="${matching.randomDistrict}"></td>
                <td th:text="${matching.location}"></td>
                <td th:text="${matching.restaurantName}"></td>
                <td th:text="${#temporals.format(matching.meetingTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <a th:href="@{/office/admin/home/randomMatching/{id}(id=${matching.id})}" class="btn btn-primary">상세보기</a>
                    <a th:href="@{/office/admin/home/randomMatching/{id}(id=${matching.id})/delete}" class="btn btn-danger">삭제</a>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(randomMatchings)}">
                <td colspan="6" class="text-center">등록된 랜덤 매칭이 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
