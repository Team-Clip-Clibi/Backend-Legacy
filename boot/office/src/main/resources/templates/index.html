<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>One Thing</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Header 불러오기 -->
<div th:replace="~{fragments/header :: header}"></div>


<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4 rounded-4" style="width: 100%; max-width: 400px;">
        <h2 class="text-center mb-4">관리자 로그인</h2>

        <!-- 타임리프 에러 메시지 -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- 타임리프 Form 전송 방식 -->
        <form th:action="@{/office/admin/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">아이디</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn custom-login-btn w-100">로그인</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
