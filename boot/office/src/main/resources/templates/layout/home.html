<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>OneThing</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 bg-light vh-100">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </div>

        <!-- Content -->
        <div class="col-md-10 p-4">
            <div th:replace="~{fragments/content :: buttons}"></div>
            <!-- 동적으로 변경될 컨텐츠 영역 -->
<!--            <div id="dynamicContent" th:replace="~{fragments/content :: dynamicContent}"></div>-->
            <div id="dynamicContent"></div>
            <!-- 기본 컨텐츠가 여기에 로드됩니다 -->
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        const buttons = document.querySelectorAll(".load-content");

        if (buttons.length > 0) {
            buttons[0].click();
        }

        buttons.forEach(button => {
            button.addEventListener("click", function () {
                const url = this.getAttribute("data-url");
                fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("네트워크 응답에 문제가 있습니다.");
                        }
                        return response.text();
                    })
                    .then(html => {
                        const dynamicContent = document.querySelector("#dynamicContent");
                        if (dynamicContent) {
                            dynamicContent.innerHTML = html;
                        } else {
                            console.error("`#dynamicContent` 요소를 찾을 수 없습니다.");
                        }
                    })
                    .catch(error => {
                        console.error("데이터를 가져오는 중 문제가 발생했습니다:", error);
                    });
            });
        });
    });
</script>


<script>
    // 탭 버튼에 active 클래스 추가하는 로직
    document.querySelectorAll('.load-content').forEach(function(button) {
        button.addEventListener('click', function() {
            // 모든 버튼에서 active 클래스 제거
            document.querySelectorAll('.load-content').forEach(function(btn) {
                btn.classList.remove('active');
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-outline-primary');
            });

            // 클릭된 버튼에 active 클래스 추가
            this.classList.add('active');
            this.classList.remove('btn-outline-primary');
            this.classList.add('btn-primary');
        });
    });

    // 상세보기 모달 활성화를 위한 이벤트 위임
    document.addEventListener('click', function(event) {
        if (event.target.classList.contains('view-detail') ||
            event.target.closest('.view-detail')) {

            const button = event.target.classList.contains('view-detail') ?
                event.target : event.target.closest('.view-detail');

            // 데이터 속성에서 정보 가져오기
            const id = button.getAttribute('data-id');
            const district = button.getAttribute('data-district');
            const location = button.getAttribute('data-location');
            const restaurant = button.getAttribute('data-restaurant');
            const time = button.getAttribute('data-time');

            // 모달에 데이터 표시
            document.getElementById('modalDistrict').textContent = `지역: ${district}`;
            document.getElementById('modalLocation').textContent = `장소: ${location}`;
            document.getElementById('modalRestaurant').textContent = `식당명: ${restaurant}`;
            document.getElementById('modalTime').textContent = `모임 시간: ${time}`;

            // 모달 활성화
            const detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
            detailModal.show();
        }
    });
</script>
</body>
</html>
