<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>OneThing</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Header -->
<div th:replace="fragments/header :: header"></div>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 bg-light vh-100">
            <div th:replace="fragments/sidebar :: sidebar"></div>
        </div>

        <!-- Content -->
        <div class="col-md-10 p-4">
            <div th:replace="fragments/content :: buttons"></div>
            <!-- 동적으로 변경될 컨텐츠 영역 -->
<!--            <div id="dynamicContent" th:replace="fragments/content :: content">-->
            <div id="dynamicContent" th:replace="fragments/content :: dynamicContent">
                <!-- 기본 컨텐츠가 여기에 로드됩니다 -->
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const buttons = document.querySelectorAll(".load-content");

        buttons.forEach(button => {
            button.addEventListener("click", function () {
                const url = this.getAttribute("data-url");
                fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("네트워크 응답에 문제가 있습니다.");
                        }
                        return response.text();
                    })
                    .then(html => {
                        const dynamicContent = document.querySelector("#dynamicContent");
                        if (dynamicContent) {
                            dynamicContent.innerHTML = html;
                        } else {
                            console.error("`#dynamicContent` 요소를 찾을 수 없습니다.");
                        }
                    })
                    .catch(error => {
                        console.error("데이터를 가져오는 중 문제가 발생했습니다:", error);
                    });
            });
        });
    });
</script>
</body>
</html>
