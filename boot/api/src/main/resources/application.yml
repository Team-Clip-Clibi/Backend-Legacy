spring:
  profiles:
    include:
    - core-data
    - office-data
    - infra
  lifecycle:
    timeout-per-shutdown-phase: 10s
  batch:
    job:
      enabled: false

server:
  shutdown: graceful



jwt:
  access-token-expiration-period-day: 1
  refresh-token-expiration-period-month: 3
  secret-key: ${JWT_KEY}

toss:
  secret-key: ${TOSS_KEY}

exclude-auth-path-patterns:
  paths:
    - path-pattern: /users/signup
      method: POST
    - path-pattern: /users/signin
      method: POST
    - path-pattern: /swagger-ui/**
      method: GET
    - path-pattern: /swagger-resources/**
      method: GET
    - path-pattern: /v3/api-docs/**
      method: GET
    - path-pattern: /users/tokens
      method: POST
    - path-pattern: /v2/users/tokens
      method: POST
    - path-pattern: /health-check
      method: GET
    - path-pattern: /zzilit/img/upload
      method: POST
    - path-pattern: /displays/banners/**
      method: GET
