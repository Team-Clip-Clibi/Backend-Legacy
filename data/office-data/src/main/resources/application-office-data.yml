spring:
  datasource:
    username: ${USERNAME}
    url: ${URL}
    password: ${PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    open-in-view: false
